<style>.bn5-hero{--bn5-bg:#37565d;--bn5-bg-light:#436067;--bn5-bg-dark:#2d474c;--bn5-bg-darker:#1e2f33;--bn5-text:#f3ead8;--bn5-text-dim:rgba(243,234,216,.72);--bn5-accent:#f3ead8;--bn5-accent-2:#f4ecdc;--bn5-accent-dim:#cdccbf;--bn5-font-body:Arial,Helvetica,sans-serif;position:relative;overflow:hidden;isolation:isolate;min-height:clamp(560px,90vh,880px);display:flex;align-items:center;font-family:var(--bn5-font-body);color:var(--bn5-text);background:var(--bn5-bg-darker)}.bn5-hero *{box-sizing:border-box}.bn5-hero a{text-decoration:none;color:inherit}.bn5-hero__slider{position:absolute;inset:0;z-index:0}.bn5-hero__slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:0;transition:opacity 1.1s ease}.bn5-hero__slide.is-active{opacity:1}.bn5-hero__scrim{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(95deg,rgba(30,47,51,.92) 0%,rgba(30,47,51,.62) 34%,rgba(30,47,51,.18) 62%,rgba(30,47,51,.05) 100%),linear-gradient(0deg,rgba(30,47,51,.75) 0%,rgba(30,47,51,0) 32%)}.bn5-hero__inner{position:relative;z-index:2;width:100%;max-width:1420px;margin:0 auto;padding:120px 24px 100px}.bn5-hero__eyebrow{max-width:640px;margin:0 0 16px;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--bn5-accent-2);text-shadow:0 1px 3px rgba(0,0,0,.4)}.bn5-hero__title{max-width:820px;margin:0 0 22px;font-weight:800;text-transform:uppercase;font-size:clamp(30px,5.2vw,58px);line-height:1.08;letter-spacing:.01em;text-shadow:0 3px 14px rgba(0,0,0,.45)}.bn5-hero__address{display:flex;align-items:flex-start;gap:8px;max-width:560px;margin:0 0 26px;font-size:clamp(14.5px,1.3vw,17px);font-weight:400;color:var(--bn5-text-dim);text-shadow:0 1px 4px rgba(0,0,0,.35)}.bn5-hero__address svg{flex-shrink:0;margin-top:2px;color:var(--bn5-accent-2)}.bn5-hero__actions{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin:0 0 40px}.bn5-hero__stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;max-width:1000px}.bn5-hero__stat-card{position:relative;border-radius:16px;padding:2px;overflow:hidden;animation:bn5-hero-stat-glow 4.6s ease-in-out infinite}.bn5-hero__stat-ring{position:absolute;inset:-70%;z-index:0;background:conic-gradient(from 0deg,rgba(243,234,216,0) 0deg,rgba(243,234,216,0) 296deg,rgba(243,234,216,.9) 330deg,#fff 344deg,rgba(243,234,216,.9) 358deg,rgba(243,234,216,0) 360deg);animation:bn5-hero-stat-spin 7s linear infinite}.bn5-hero__stat-fill{position:absolute;inset:2px;z-index:1;border-radius:14px;background:linear-gradient(160deg,rgba(55,86,93,.62) 0%,rgba(30,47,51,.8) 100%);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(243,234,216,.1)}.bn5-hero__stat-inner{position:relative;z-index:2;padding:20px 18px;display:flex;flex-direction:column;gap:6px}.bn5-hero__stat-num{font-size:clamp(24px,2.4vw,32px);font-weight:300;line-height:1}.bn5-hero__stat-label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--bn5-text-dim)}@keyframes bn5-hero-stat-spin{to{transform:rotate(360deg)}}@keyframes bn5-hero-stat-glow{0%,100%{box-shadow:0 0 16px 1px rgba(243,234,216,.13),0 10px 22px rgba(0,0,0,.3)}50%{box-shadow:0 0 28px 5px rgba(243,234,216,.26),0 10px 22px rgba(0,0,0,.3)}}.bn5-hero a.bn5-hero__cta{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--bn5-accent-2) 0%,var(--bn5-accent) 55%,var(--bn5-accent-dim) 100%);color:var(--bn5-bg);font-weight:800;font-size:18px;padding:18px 36px;border-radius:9px;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.6) inset,0 -2px 4px rgba(0,0,0,.12) inset;transition:transform .15s,box-shadow .15s}.bn5-hero__cta span{position:relative;z-index:1}.bn5-hero__cta::before{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(115deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.85) 50%,rgba(255,255,255,0) 100%);transform:skewX(-20deg);animation:bn5-hero-shimmer 3.4s ease-in-out infinite}@keyframes bn5-hero-shimmer{0%{left:-60%}35%{left:130%}100%{left:130%}}.bn5-hero a.bn5-hero__cta:hover{transform:translateY(-2px);box-shadow:0 11px 26px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.7) inset}.bn5-hero a.bn5-hero__cta-ghost{padding:17px 32px;border-radius:9px;font-weight:800;font-size:18px;border:1.5px solid rgba(243,234,216,.55);color:var(--bn5-text);background:rgba(243,234,216,.06);backdrop-filter:blur(2px);transition:background .18s,border-color .18s,transform .15s}.bn5-hero a.bn5-hero__cta-ghost:hover{background:rgba(243,234,216,.16);border-color:var(--bn5-accent-2);transform:translateY(-2px)}.bn5-hero__arrow{position:absolute;top:28px;z-index:3;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(30,47,51,.45);border:1px solid rgba(243,234,216,.3);color:var(--bn5-text);cursor:pointer;backdrop-filter:blur(3px);box-shadow:0 4px 14px rgba(0,0,0,.3);transition:background .18s,transform .18s,border-color .18s}.bn5-hero__arrow:hover{background:rgba(30,47,51,.7);border-color:var(--bn5-accent-2);transform:scale(1.06)}.bn5-hero__arrow--prev{left:20px}.bn5-hero__arrow--next{right:20px}.bn5-hero__dots{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:3;display:flex;gap:9px}.bn5-hero__dots button{width:9px;height:9px;border-radius:50%;padding:0;border:1px solid rgba(243,234,216,.6);background:rgba(243,234,216,.25);cursor:pointer;transition:background .2s,width .2s}.bn5-hero__dots button.is-active{background:var(--bn5-accent);width:22px;border-radius:5px}@media (max-width:780px){.bn5-hero{min-height:0}.bn5-hero__inner{padding:100px 18px 60px}.bn5-hero__arrow{width:38px;height:38px}.bn5-hero__arrow--prev{left:10px}.bn5-hero__arrow--next{right:10px}.bn5-hero__actions{gap:12px;margin-bottom:32px}.bn5-hero a.bn5-hero__cta,.bn5-hero a.bn5-hero__cta-ghost{padding:15px 24px;font-size:16px}.bn5-hero__stat-grid{grid-template-columns:repeat(2,1fr);gap:12px;max-width:460px}.bn5-hero__stat-inner{padding:16px 14px}}@media (max-width:420px){.bn5-hero__actions{flex-direction:column;align-items:stretch}.bn5-hero a.bn5-hero__cta,.bn5-hero a.bn5-hero__cta-ghost{text-align:center}}</style>

<script>(function(){
var root = document.getElementById('bn5-hero');
var slides = root.querySelectorAll('.bn5-hero__slide');
var dots = root.querySelectorAll('.bn5-hero__dots button');
var prevBtn = root.querySelector('.bn5-hero__arrow--prev');
var nextBtn = root.querySelector('.bn5-hero__arrow--next');
var current = 0;
var timer = null;
function show(index){
slides[current].classList.remove('is-active');
dots[current].classList.remove('is-active');
dots[current].setAttribute('aria-selected', 'false');
current = (index + slides.length) % slides.length;
slides[current].classList.add('is-active');
dots[current].classList.add('is-active');
dots[current].setAttribute('aria-selected', 'true');
}
function next(){ show(current + 1); }
function prev(){ show(current - 1); }
function startAutoplay(){
stopAutoplay();
timer = setInterval(next, 3000);
}
function stopAutoplay(){
if (timer){ clearInterval(timer); timer = null; }
}
nextBtn.addEventListener('click', function(){ next(); startAutoplay(); });
prevBtn.addEventListener('click', function(){ prev(); startAutoplay(); });
dots.forEach(function(dot, i){
dot.addEventListener('click', function(){ show(i); startAutoplay(); });
});
root.addEventListener('mouseenter', stopAutoplay);
root.addEventListener('mouseleave', startAutoplay);
startAutoplay();
})();</script>
