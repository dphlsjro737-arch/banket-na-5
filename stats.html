<style>.bn5-stats{--bn5-bg-darker:#1e2f33;--bn5-text:#f3ead8;--bn5-text-dim:rgba(243,234,216,.75);--bn5-glow:rgba(243,234,216,.9);--bn5-font-body:Arial,Helvetica,sans-serif;position:relative;overflow:hidden;isolation:isolate;font-family:var(--bn5-font-body);color:var(--bn5-text);background:var(--bn5-bg-darker);padding:clamp(64px,9vw,110px) 24px}.bn5-stats *{box-sizing:border-box}.bn5-stats__slider{position:absolute;inset:0;z-index:0}.bn5-stats__slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:0;transition:opacity 1.4s ease}.bn5-stats__slide.is-active{opacity:1}.bn5-stats__scrim{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(30,47,51,.82) 0%,rgba(30,47,51,.72) 100%)}.bn5-stats__inner{position:relative;z-index:2;max-width:1420px;margin:0 auto}.bn5-stats__grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.bn5-stats__card{position:relative;border-radius:18px;padding:2px;overflow:hidden;animation:bn5-stats-glow 4.6s ease-in-out infinite}.bn5-stats__ring{position:absolute;inset:-70%;z-index:0;background:conic-gradient(from 0deg,rgba(243,234,216,0) 0deg,rgba(243,234,216,0) 296deg,rgba(243,234,216,.9) 330deg,#fff 344deg,rgba(243,234,216,.9) 358deg,rgba(243,234,216,0) 360deg);animation:bn5-stats-spin 7s linear infinite}.bn5-stats__fill{position:absolute;inset:2px;z-index:1;border-radius:16px;background:linear-gradient(160deg,rgba(55,86,93,.62) 0%,rgba(30,47,51,.78) 100%);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(243,234,216,.1)}.bn5-stats__card-inner{position:relative;z-index:2;padding:30px 26px;display:flex;flex-direction:column;gap:8px}.bn5-stats__num{font-size:clamp(32px,3.6vw,46px);font-weight:300;line-height:1;letter-spacing:.01em}.bn5-stats__label{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--bn5-text-dim)}@keyframes bn5-stats-spin{to{transform:rotate(360deg)}}@keyframes bn5-stats-glow{0%,100%{box-shadow:0 0 20px 1px rgba(243,234,216,.14),0 14px 30px rgba(0,0,0,.35)}50%{box-shadow:0 0 36px 7px rgba(243,234,216,.3),0 14px 30px rgba(0,0,0,.35)}}@media (max-width:900px){.bn5-stats__grid{grid-template-columns:repeat(2,1fr);gap:16px}.bn5-stats__card-inner{padding:24px 20px}}@media (max-width:420px){.bn5-stats__num{font-size:30px}.bn5-stats__card-inner{padding:20px 16px}}</style>

<script>(function(){
var root = document.getElementById('bn5-stats');
var slides = root.querySelectorAll('.bn5-stats__slide');
var current = 0;
setInterval(function(){
slides[current].classList.remove('is-active');
current = (current + 1) % slides.length;
slides[current].classList.add('is-active');
}, 5000);
})();</script>
